<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Khách xem hàng rồi làm gì?</title><desc id="desc">Chọn luồng phù hợp với cách bạn bán. Minh họa khái niệm, không phải website khách hàng.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#e8edff"/></linearGradient></defs><rect width="1200" height="675" rx="30" fill="url(#bg)"/><g font-family="Arial,sans-serif" fill="#111c35"><text x="70" y="85" font-size="18" fill="#163cff" letter-spacing="3">HUNPEOLABS · GÓC NHÌN THỰC TẾ</text><text x="70" y="160" font-size="42" font-weight="700">Khách xem hàng rồi làm gì?</text><text x="70" y="208" font-size="24" fill="#536078">Chọn luồng phù hợp với cách bạn bán</text><rect x="70" y="285" width="330" height="230" rx="20" fill="white" stroke="#c9d3ff"/><circle cx="115" cy="337" r="24" fill="#163cff"/><text x="108" y="345" font-size="20" fill="white">1</text><text x="95" y="403" font-size="23" font-weight="700">Xem sản phẩm</text><text x="95" y="449" font-size="17" fill="#536078">Ảnh và thông tin rõ</text><rect x="430" y="285" width="330" height="230" rx="20" fill="white" stroke="#c9d3ff"/><circle cx="475" cy="337" r="24" fill="#163cff"/><text x="468" y="345" font-size="20" fill="white">2</text><text x="455" y="403" font-size="23" font-weight="700">Catalogue: hỏi mua</text><text x="455" y="449" font-size="17" fill="#536078">Trao đổi trước khi chốt</text><rect x="790" y="285" width="330" height="230" rx="20" fill="white" stroke="#c9d3ff"/><circle cx="835" cy="337" r="24" fill="#163cff"/><text x="828" y="345" font-size="20" fill="white">3</text><text x="815" y="403" font-size="23" font-weight="700">E-commerce: đặt hàng</text><text x="815" y="449" font-size="17" fill="#536078">Quy trình đơn đã thống nhất</text><text x="70" y="594" font-size="20" fill="#536078">Minh họa để trao đổi nhu cầu · Tính năng và chi phí được thống nhất theo phạm vi</text></g></svg>