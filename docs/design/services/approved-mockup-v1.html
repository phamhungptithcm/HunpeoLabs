="work"><div class="section-head"><div><span class="eyebrow">OUR OWN ENGINEERING PROJECTS</span><h2>Explore how we build.</h2></div><p>A look at our engineering approaches and the problems we explore. These are our own projects, each at its stated stage.</p></div><div class="projects">${[['AI Agent Kit','Open-source engineering platform','Repository-aware agent workflows with explicit controls and reviewable evidence.',['Context','Agent','Review']],['Gig','Open-source engineering project','Connect source changes, release paths, and the evidence behind a delivery.',['Source','Release','Evidence']],['IncOv','Under validation','Explore incident decision support with trusted knowledge and human review.',['Incident','Knowledge','Decision']]].map(p=>`<article class="project"><div class="project-art" aria-hidden="true">${p[3].map(v=>`<span>${v}</span>`).join('<i>→</i>')}</div><span class="status">${p[1]}</span><h3>${p[0]}</h3><p>${p[2]}</p><button class="text-link" data-project="${p[0]}">Explore project ↗</button></article>`).join('')}</div></section><section class="section faq"><div><span class="eyebrow">BEFORE WE START</span><h2>A few practical<br>questions.</h2></div><div><details><summary>Can we start with an idea?</summary><p>Yes. Start with the problem, the intended users, and the outcome you want. Discovery defines the first scope and the decisions needed before development.</p></details><details><summary>What will we receive at handover?</summary><p>The agreed deliverables, relevant source code and documentation, test results, and any accepted limitations. The exact handover is defined before work begins.</p></details><details><summary>Can you work on an existing product?</summary><p>Yes. We first review the relevant product and technical constraints, then agree on a focused change and how it will be verified.</p></details><details><summary>Are launch and ongoing support included?</summary><p>Hosting, store submission, deployment, and ongoing support are agreed in function detail(s){const i=services.indexOf(s);return `<div class="detail"><div class="wrap"><div class="crumb"><a href="#overview">Services</a> / ${s.name}</div><section class="hero"><div><span class="eyebrow">0${i+1} / ${s.name.toUpperCase()}</span><h1>${s.headline}</h1><p>${s.summary}</p><div class="actions"><button class="btn primary" data-contact>Discuss your project <span aria-hidden="true">↗</span></button><a class="btn" href="#deliverables">What we deliver ↓</a></div></div><aside class="deliver-summary"><small>THE OUTCOME</small><h3>What you leave with.</h3><p>${s.outcome}</p></aside></section><section class="fit"><h3>When to bring us in.</h3><p>${s.fit}</p></section><section class="section deliverables" id="deliverables"><div><span class="eyebrow">WHAT WE DELIVER</span><h2>Concrete work.<br>Clear handover.</h2><p>We define the deliverables and acceptance criteria together before work begins.</p><div class="scope"><h4>Agreed for your project.</h4><p>${s.scope}</p></div></div><ol class="outputs">${s.deliverables.map((d,j)=>`<li><b>0${j+1}</b><span>${d}</span></li>`).join('')}</ol></section></div>${delivery(s.steps)}<div class="wrap"><section class="section"><span class="eyebrow">FIND THE RIGHT FIT</span><h2>Explore related services.</h2><div class="related">${services.filter((_,n)=>n!==i&&Math.floor(n/2)===Math.floor(i/2)).map(r=>`<a href="#${r.slug}">${r.name} ↗</a>`).join('')}<a href="#overview">All services ↗</a></div></section>${cta()}</div></div>`}
picker.innerHTML='<option value="overview">Services overview</option>'+services.map(s=>`<option value="${s.slug}">${s.name}</option>`).join('');
function route(){let key=location.hash.slice(1)||'overview';if(key==='work'||key==='deliverables'){document.getElementById(key)?.scrollIntoView();return}let s=services.find(s=>s.slug===key);main.innerHTML=s?detail(s):overview();picker.value=s?s.slug:'overview';document.title=(s?s.name:'Services')+' — Hunpeo Labs · Design preview';window.scrollTo(0,0)}
picker.addEventListener('change',()=>{location.hash=picker.value});window.addEventListener('hashchange',route);document.addEventListener('click',e=>{const b=e.target.closest('[data-contact],[data-project]');if(!b)return;document.getElementById('dialog-title').textContent=b.dataset.project||'Start with your project.';document.getElementById('dialog-body').textContent=b.dataset.project?'The website will link to the existing '+b.dataset.project+' product page. This is a Services design preview; the product page is outside this mockup.':'The website will open the contact page. This preview does not collect or send information.';dialog.showModal()});route();
</script></body></html>
