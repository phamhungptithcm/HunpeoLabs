allowBuilds:
  '@ampproject/toolbox-optimizer': false
  '@firebase/util': false
  protobufjs: false
  es5-ext: false
  fsevents: false
  sharp: true
  unrs-resolver: true

# Security fixes for Firebase/Google SDK transitive dependencies; gaxios uses uuid.v4 only.
overrides:
  'uuid@<11.1.1': 11.1.1
  '@grpc/grpc-js@<1.13.6': 1.13.6
  'nanoid@<3.3.18': 3.3.18
