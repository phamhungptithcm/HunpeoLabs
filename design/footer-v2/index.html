<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunpeo Labs — footer design proposal</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,"Helvetica Neue",sans-serif}a{color:inherit;text-decoration:none}a:hover{color:#173df5}a:focus-visible{outline:2px solid #173df5;outline-offset:5px}
    .context{height:110px;display:flex;align-items:center;justify-content:center;color:#aaa;font:10px Consolas,monospace;letter-spacing:.08em;background:#fafafa;border-bottom:1px solid #d9dbe1}
    footer{max-width:1600px;margin:auto;padding:30px clamp(20px,4vw,72px) 20px}.top{display:flex;justify-content:space-between;gap:48px}.identity{max-width:600px}.tagline{margin:0 0 14px;font-size:15px;font-weight:500;line-height:1.5;letter-spacing:-.15px}.address{font-size:12px;line-height:1.8;color:#5e6067;font-style:normal}.founder{margin:4px 0 0;color:#5e6067;font-size:12px;line-height:1.8}.founder span{color:#111}.contact{text-align:right;flex-shrink:0}.direct{display:flex;align-items:center;gap:22px;font-size:13px;line-height:1.7}.direct a{white-space:nowrap}.dot{width:3px;height:3px;background:#a8abb4;border-radius:50%}.hours{margin:10px 0 0;font-size:11px;line-height:1.8;color:#5e6067;font-family:Consolas,"Liberation Mono",monospace}.bottom{margin-top:25px;padding-top:14px;border-top:1px solid #eceef1;display:flex;align-items:center;justify-content:space-between;gap:20px;color:#5e6067;font:10px/1.8 Consolas,"Liberation Mono",monospace}.legal{display:flex;gap:22px}
    @media(max-width:700px){.context{height:60px}.top{flex-direction:column;gap:20px}footer{padding-top:25px}.tagline{max-width:300px;font-size:15px;margin-bottom:12px}.identity{max-width:340px}.contact{text-align:left}.direct{flex-wrap:wrap;gap:8px 16px;font-size:12px}.hours{margin-top:8px}.bottom{margin-top:22px;padding-top:14px;align-items:flex-start;font-size:9px}.legal{gap:12px}}
    @media(max-width:350px){.direct{flex-direction:column;align-items:flex-start;gap:3px}.dot{display:none}.bottom{flex-direction:column;gap:6px}}
  </style>
</head>
<body>
  <div class="context" aria-hidden="true">PAGE CONTENT · FOOTER MOCKUP</div>
  <footer>
    <div class="top">
      <div class="identity">
        <p class="tagline">Digital products. AI systems. Enterprise engineering.</p>
        <address class="address">Xóm 2, Đông Dương, Quảng Trạch, Quảng Trị 470000</address>
        <p class="founder">Founded by <span>Hung Pham</span></p>
      </div>
      <div class="contact">
        <div class="direct"><a href="mailto:support@hunpeolabs.com">support@hunpeolabs.com</a><span class="dot" aria-hidden="true"></span><a href="tel:+84889680497">+84 889 680 497</a></div>
        <p class="hours">Mon–Fri · 8 AM–5 PM</p>
      </div>
    </div>
    <div class="bottom"><span>© 2026 Hunpeo Labs</span><div class="legal"><a href="/privacy">Privacy</a></div></div>
  </footer>
</body>
</html>
