name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://example.com
      RELEASE_TAG: ${{ github.ref_name }}
      REQUIRE_CONTACT_DELIVERY: "false"
      VERCEL_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541dca151540d0c3765dca5a3eb0c
        with:
          node-version: "24"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic release build
        run: pnpm release:build "$RELEASE_TAG"

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run core desktop and mobile E2E
        run: pnpm test:e2e:core

      - name: Run Firefox and WebKit smoke coverage
        run: pnpm test:e2e:cross-browser

      - name: Enforce Lighthouse SEO and quality baseline
        run: pnpm lighthouse:ci

  publish:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Load reviewed release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/docs/releases/$GITHUB_REF_NAME.md?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hunpeo Labs Website $GITHUB_REF_NAME — Production-Ready Marketing Foundation" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
