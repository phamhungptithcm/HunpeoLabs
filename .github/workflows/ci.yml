name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://example.com
      REQUIRE_CONTACT_DELIVERY: "false"
      VERCEL_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541dca151540d0c3765dca5a3eb0c
        with:
          node-version: "24"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source, tests, and production build
        run: pnpm check

      - name: Validate fail-closed production configuration contract
        run: pnpm validate:production-env

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run core desktop and mobile E2E
        run: pnpm test:e2e:core

      - name: Run Firefox and WebKit smoke coverage
        run: pnpm test:e2e:cross-browser

      - name: Enforce Lighthouse SEO and quality baseline
        run: pnpm lighthouse:ci
